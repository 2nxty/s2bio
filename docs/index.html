<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0b0d" />
  <meta name="description" content="Redirecionando para S2.RIP" />
  <meta http-equiv="refresh" content="2;url=https://s2.rip" />
  <title>Redirecionando — S2.RIP</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.0.20/index.css" rel="stylesheet" />

  <style>
    :root {
      --bg: #0a0b0d;
      --panel: rgba(255,255,255,.035);
      --panel-border: rgba(255,255,255,.09);
      --fg: #e9e9ea;
      --fg-dim: #a7a9ad;
      --fg-mute: #6c6f74;
      --accent: #f97316;
      --accent-dim: rgba(249,115,22,.14);
      --accent-border: rgba(249,115,22,.35);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: "Satoshi", ui-sans-serif, system-ui, sans-serif;
    }

    #particles {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(92vw, 32rem);
      padding: 2.25rem;
      text-align: center;
      border: 1px solid var(--panel-border);
      border-radius: 1rem;
      background: var(--panel);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .logo {
      width: 3.5rem;
      height: 3.5rem;
      display: grid;
      place-items: center;
      margin: 0 auto 1.25rem;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 1px solid var(--accent-border);
      color: var(--accent);
      font-size: 1.45rem;
    }

    .eyebrow {
      margin: 0 0 .55rem;
      color: var(--accent);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: .7rem;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 2.7rem);
      letter-spacing: -.025em;
      line-height: 1.1;
    }

    .subtitle {
      margin: .9rem auto 1.5rem;
      max-width: 25rem;
      color: var(--fg-dim);
      font-size: .98rem;
      line-height: 1.6;
    }

    .loader {
      height: 3px;
      width: 100%;
      overflow: hidden;
      margin: 0 0 1rem;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
    }

    .loader::after {
      content: "";
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      animation: progress 4s linear forwards;
    }

    @keyframes progress { to { width: 100%; } }

    .status {
      margin: 0 0 1.25rem;
      color: var(--fg-mute);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: .75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      padding: .8rem 1.2rem;
      border-radius: .625rem;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--bg);
      font-weight: 700;
      text-decoration: none;
      transition: transform 150ms ease, background-color 150ms ease;
    }

    .btn:hover { background: #e0670f; }
    .btn:active { transform: translateY(1px); }

    .domain {
      display: block;
      margin-top: 1rem;
      color: var(--fg-mute);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: .72rem;
    }

    @media (max-width: 520px) {
      .wrap { padding: 1.75rem 1.25rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .loader::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>

  <main class="wrap" role="main" aria-live="polite">
    <div class="logo"><i class="bi bi-suit-heart-fill" aria-hidden="true"></i></div>
    <p class="eyebrow">heart rip</p>
    <h1>redirecionando<span style="color:var(--accent)">...</span></h1>
    <p class="subtitle">Você será enviado para o destino em alguns segundos.</p>

    <div class="loader" aria-hidden="true"></div>
    <p class="status" id="status">continuando em 2 segundos</p>

    <a class="btn" href="https://s2.rip" rel="noopener">
      Ir agora <i class="bi bi-arrow-right" aria-hidden="true"></i>
    </a>
    <span class="domain">s2.rip</span>
  </main>

  <script>
    const destination = "https://s2.rip";
    let seconds = 2;
    const status = document.getElementById("status");

    const timer = setInterval(() => {
      seconds -= 1;
      if (seconds > 0) {
        status.textContent = `continuando em ${seconds} segundo${seconds === 1 ? "" : "s"}`;
      } else {
        clearInterval(timer);
        status.textContent = "redirecionando agora";
      }
    }, 1000);

    setTimeout(() => {
      window.location.replace(destination);
    }, 4000);

    (function () {
      const canvas = document.getElementById("particles");
      const ctx = canvas.getContext("2d");
      if (!ctx) return;

      const NEUTRAL = "210, 213, 218";
      const EMBER = "249, 115, 22";
      let dpr = 1, w = 0, h = 0, particles = [], t = 0;

      function makeParticle() {
        const ember = Math.random() < 0.22;
        return {
          x: Math.random() * w,
          y: Math.random() * h,
          r: ember ? 1 + Math.random() * 1.4 : .6 + Math.random(),
          opacity: ember ? .3 + Math.random() * .3 : .08 + Math.random() * .16,
          dx: (Math.random() - .5) * .1,
          dy: -(.06 + Math.random() * .16),
          phase: Math.random() * Math.PI * 2,
          speed: .006 + Math.random() * .01,
          color: ember ? EMBER : NEUTRAL
        };
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        particles = Array.from({ length: Math.max(45, Math.round((w * h) / 15000)) }, makeParticle);
      }

      function loop() {
        ctx.clearRect(0, 0, w, h);
        for (const p of particles) {
          const twinkle = .6 + .4 * Math.sin(t * p.speed + p.phase);
          ctx.fillStyle = `rgba(${p.color}, ${p.opacity * twinkle})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
          p.x += p.dx;
          p.y += p.dy;
          if (p.y < -6) p.y = h + 6;
          if (p.x < -6) p.x = w + 6;
          if (p.x > w + 6) p.x = -6;
        }
        t += 1;
        requestAnimationFrame(loop);
      }

      resize();
      window.addEventListener("resize", resize);
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
